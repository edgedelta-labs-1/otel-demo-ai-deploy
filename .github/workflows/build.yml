# Builds the checkout image for one commit without deploying it.
name: build
run-name: build ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/edgedelta/otel-demo-ai-deploy-checkout

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: image
        run: |
          if docker manifest inspect "$IMAGE:${{ inputs.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.image.outputs.exists == 'false'

      - uses: docker/build-push-action@v7.4.0
        if: steps.image.outputs.exists == 'false'
        with:
          context: .
          file: src/checkout/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.sha }}
          cache-from: type=gha,scope=checkout-arm64
          cache-to: type=gha,mode=max,scope=checkout-arm64
