# Builds the checkout image for one commit and deploys the demo to EKS.
name: deploy
run-name: deploy ${{ inputs.sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy; empty deploys the head of the selected ref.
        required: false
        type: string

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/edgedelta-labs-1/otel-demo-ai-deploy-checkout
  CHART_VERSION: 0.42.6
  DEPLOY_SHA: ${{ inputs.sha || github.sha }}

jobs:
  build:
    # The demo nodes are arm64, so the image is built on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: image
        run: |
          if docker manifest inspect "$IMAGE:$DEPLOY_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.image.outputs.exists == 'false'

      - uses: docker/build-push-action@v7.4.0
        if: steps.image.outputs.exists == 'false'
        with:
          context: .
          file: src/checkout/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=checkout-arm64
          cache-to: type=gha,mode=max,scope=checkout-arm64

  deploy:
    # The only job in the demo environment, so each run creates exactly one GitHub deployment.
    needs: build
    # Runs inside the demo cluster, whose API is private; the runner's service account deploys the shop.
    runs-on: otel-demo-deploy
    environment: demo
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: azure/setup-helm@v5.0.1

      - uses: azure/setup-kubectl@v5.1.0

      - name: Deploy
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
            --version "$CHART_VERSION" -n otel-demo \
            -f deploy/edgedelta/values.yaml \
            -f deploy/edgedelta/values-arm64-pool.yaml \
            --set components.checkout.imageOverride.tag="$DEPLOY_SHA"
          kubectl -n otel-demo rollout status deploy/checkout --timeout=180s

      - name: Summary
        run: echo "Deployed checkout at \`$DEPLOY_SHA\` (run ref \`$GITHUB_SHA\`)." >> "$GITHUB_STEP_SUMMARY"
